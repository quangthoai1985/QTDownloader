# Phát hành: đẩy tag vX.Y.Z (hoặc chạy tay) → build trên Windows, chạy test, đóng gói zip + bộ cài,
# cài thử / gỡ thử bộ cài, rồi tạo GitHub Release kèm mọi tệp trong release\ (xem CLAUDE.md §3).
name: Phát hành

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag phát hành (vd v1.1.0) — phải trùng __version__"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cài thư viện
        run: python -m pip install -r requirements.txt

      - name: Kiểm tra tag khớp phiên bản
        shell: pwsh
        run: |
          $ver = python -c "import qtdownloader; print(qtdownloader.__version__)"
          if ("v$ver" -ne $env:TAG) { throw "Tag $env:TAG khác __version__ $ver" }
          "VERSION=$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Chạy test
        run: python -m pytest -q tests

      - name: Build QTDownloader.exe
        shell: cmd
        run: build.bat

      - name: Cài Inno Setup (nếu máy chưa có)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Đóng gói zip + bộ cài
        run: python tools/package_release.py

      - name: Cài thử, chạy thử, gỡ thử bộ cài
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Resolve-Path "release\QTDownloader-$env:VERSION-setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP "QT Downloader"
          $data = Join-Path $env:RUNNER_TEMP "qtd-data"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{60877C1B-878F-46D0-A5B2-F015CCF3F562}_is1"
          Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/DIR=`"$dir`"" -Wait
          if (-not (Test-Path "$dir\QTDownloader.exe")) { throw "Không thấy QTDownloader.exe sau khi cài" }
          if (-not (Test-Path "$dir\unins000.exe")) { throw "Không có trình gỡ cài đặt" }
          $reg = Get-ItemProperty $key
          if ($reg.DisplayName -ne "QT Downloader" -or $reg.DisplayVersion -ne $env:VERSION) { throw "Mục gỡ cài đặt sai: $($reg.DisplayName) $($reg.DisplayVersion)" }
          # chạy bản đã cài với dữ liệu tạm, chờ API cục bộ trả lời
          New-Item -ItemType Directory -Force $data | Out-Null
          '{"api_port": 41999, "check_updates": false}' | Set-Content -Encoding ascii "$data\settings.json"
          $env:QTDOWNLOADER_DATA = $data
          $p = Start-Process "$dir\QTDownloader.exe" -ArgumentList "--minimized" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Milliseconds 500
            try { $r = Invoke-RestMethod "http://127.0.0.1:41999/api/ping" -TimeoutSec 2; $ok = $r.app -eq "QT Downloader" } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (-not $ok) { throw "App đã cài không mở được API 127.0.0.1:41999" }
          Write-Host "Bản cài chạy được: $($r | ConvertTo-Json -Compress)"
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          # trình gỡ cài đặt tự chép sang thư mục tạm rồi chạy tiếp → chờ nó xong
          for ($i = 0; $i -lt 60 -and ((Test-Path $key) -or (Test-Path "$dir\QTDownloader.exe")); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $key) { throw "Gỡ cài đặt còn để lại khoá registry" }
          if (Test-Path "$dir\QTDownloader.exe") { throw "Gỡ cài đặt còn để lại tệp" }
          Write-Host "Cài / gỡ bộ cài: OK"

      - name: Ghi chú phát hành từ CHANGELOG
        shell: python
        run: |
          import os, re
          ver = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(ver)}\].*?$\n(.*?)(?=^## \[)", text, re.M | re.S)
          body = (m.group(1).strip() if m else f"QT Downloader {ver}")
          body += ("\n\n### Tải về\n- **`QTDownloader-%s-setup.exe`** — bộ cài (khuyên dùng): cài không cần quyền quản trị,"
                   " gỡ trong Cài đặt › Ứng dụng, tự cập nhật.\n- `QTDownloader-%s-win64.zip` — bản giải nén chạy ngay.\n"
                   "- `QTDownloader-extension-%s.zip` — extension Chrome/Edge/Cốc Cốc.\n"
                   "- `TDownload-%s-win64.zip` — bản sao cho trình cập nhật của TDownload ≤ 1.0.3.\n"
                   "- `SHA256SUMS.txt` — mã SHA-256 của các tệp trên.\n" % (ver, ver, ver, ver))
          open("release-notes.md", "w", encoding="utf-8").write(body)

      - name: Tạo GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Get-ChildItem release | Format-Table Name, Length
          gh release create $env:TAG (Get-ChildItem release).FullName --title "QT Downloader $env:VERSION" --notes-file release-notes.md --target $env:GITHUB_SHA
