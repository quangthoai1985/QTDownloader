# Phát hành: đẩy tag vX.Y.Z (hoặc chạy tay) → build trên Windows, chạy test, đóng gói zip + bộ cài,
# cài thử / gỡ thử bộ cài, rồi tạo GitHub Release kèm mọi tệp trong release\ (xem CLAUDE.md §3).
#
# Ký số miễn phí qua SignPath Foundation (docs/CODE_SIGNING.md): chỉ bật khi repo có biến
# SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG (Settings › Variables) và secret
# SIGNPATH_API_TOKEN. Ký 2 lần: QTDownloader.exe (trước khi đóng gói) rồi bộ cài; mỗi lần chờ người duyệt trên SignPath.
name: Phát hành

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag phát hành (vd v1.1.0) — phải trùng __version__"
        required: true
      publish:
        description: "Tạo GitHub Release (bỏ chọn = chạy thử: build, ký, cài thử nhưng không xuất bản)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 180   # ký số chờ người duyệt trên SignPath (tối đa 1 giờ mỗi lần)
    env:
      PYTHONUTF8: "1"
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
      SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cài thư viện
        run: python -m pip install -r requirements.txt

      - name: Kiểm tra tag khớp phiên bản
        shell: pwsh
        run: |
          $ver = python -c "import qtdownloader; print(qtdownloader.__version__)"
          if ("v$ver" -ne $env:TAG) { throw "Tag $env:TAG khác __version__ $ver" }
          "VERSION=$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Chạy test
        run: python -m pytest -q tests

      - name: Build QTDownloader.exe
        shell: cmd
        run: build.bat

      - name: Liệt kê tệp chương trình chưa ký số (tham khảo)
        shell: pwsh
        run: |
          $files = Get-ChildItem dist\QTDownloader -Recurse -Include *.exe,*.dll,*.pyd
          $sig = $files | Get-AuthenticodeSignature
          $sig | Group-Object Status | Format-Table Name, Count
          $sig | Where-Object Status -ne Valid | ForEach-Object { $_.Path.Substring((Resolve-Path dist).Path.Length + 1) } | Select-Object -First 300

      - name: "Ký số: tải QTDownloader.exe lên"
        if: env.SIGNING == 'true'
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-exe
          path: dist/QTDownloader/QTDownloader.exe
          if-no-files-found: error

      - name: "Ký số: SignPath ký QTDownloader.exe (chờ duyệt)"
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app

      - name: "Ký số: thay QTDownloader.exe bằng bản đã ký"
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $s = Get-AuthenticodeSignature signed-app\QTDownloader.exe
          if ($s.Status -ne "Valid") { throw "QTDownloader.exe chưa ký hợp lệ: $($s.Status) $($s.StatusMessage)" }
          Write-Host "Đã ký bởi: $($s.SignerCertificate.Subject)"
          Copy-Item signed-app\QTDownloader.exe dist\QTDownloader\QTDownloader.exe -Force

      - name: Cài Inno Setup (nếu máy chưa có)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Đóng gói zip + bộ cài
        run: python tools/package_release.py

      - name: "Ký số: tải bộ cài lên"
        if: env.SIGNING == 'true'
        id: upload-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: release/QTDownloader-${{ env.VERSION }}-setup.exe
          if-no-files-found: error

      - name: "Ký số: SignPath ký bộ cài (chờ duyệt)"
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup

      - name: "Ký số: thay bộ cài bằng bản đã ký, ghi lại SHA256SUMS"
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "QTDownloader-$env:VERSION-setup.exe"
          $s = Get-AuthenticodeSignature "signed-setup\$name"
          if ($s.Status -ne "Valid") { throw "Bộ cài chưa ký hợp lệ: $($s.Status) $($s.StatusMessage)" }
          Write-Host "Đã ký bởi: $($s.SignerCertificate.Subject)"
          Copy-Item "signed-setup\$name" "release\$name" -Force
          python tools/package_release.py --sums-only

      - name: Cài thử, chạy thử, gỡ thử bộ cài
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Resolve-Path "release\QTDownloader-$env:VERSION-setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP "QT Downloader"
          $data = Join-Path $env:RUNNER_TEMP "qtd-data"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{60877C1B-878F-46D0-A5B2-F015CCF3F562}_is1"
          Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/DIR=`"$dir`"" -Wait
          if (-not (Test-Path "$dir\QTDownloader.exe")) { throw "Không thấy QTDownloader.exe sau khi cài" }
          if (-not (Test-Path "$dir\unins000.exe")) { throw "Không có trình gỡ cài đặt" }
          if ($env:SIGNING -eq "true") {
            foreach ($f in @($setup.Path, "$dir\QTDownloader.exe")) {
              $s = Get-AuthenticodeSignature $f
              if ($s.Status -ne "Valid") { throw "$f chưa ký hợp lệ: $($s.Status)" }
            }
          }
          $reg = Get-ItemProperty $key
          if ($reg.DisplayName -ne "QT Downloader" -or $reg.DisplayVersion -ne $env:VERSION) { throw "Mục gỡ cài đặt sai: $($reg.DisplayName) $($reg.DisplayVersion)" }
          # chạy bản đã cài với dữ liệu tạm, chờ API cục bộ trả lời
          New-Item -ItemType Directory -Force $data | Out-Null
          '{"api_port": 41999, "check_updates": false}' | Set-Content -Encoding ascii "$data\settings.json"
          $env:QTDOWNLOADER_DATA = $data
          $p = Start-Process "$dir\QTDownloader.exe" -ArgumentList "--minimized" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Milliseconds 500
            try { $r = Invoke-RestMethod "http://127.0.0.1:41999/api/ping" -TimeoutSec 2; $ok = $r.app -eq "QT Downloader" } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (-not $ok) { throw "App đã cài không mở được API 127.0.0.1:41999" }
          Write-Host "Bản cài chạy được: $($r | ConvertTo-Json -Compress)"
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          # trình gỡ cài đặt tự chép sang thư mục tạm rồi chạy tiếp → chờ nó xong
          for ($i = 0; $i -lt 60 -and ((Test-Path $key) -or (Test-Path "$dir\QTDownloader.exe")); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $key) { throw "Gỡ cài đặt còn để lại khoá registry" }
          if (Test-Path "$dir\QTDownloader.exe") { throw "Gỡ cài đặt còn để lại tệp" }
          Write-Host "Cài / gỡ bộ cài: OK"

      - name: Ghi chú phát hành từ CHANGELOG
        shell: python
        run: |
          import os, re
          ver = os.environ["VERSION"]
          signed = os.environ.get("SIGNING") == "true"
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(ver)}\].*?$\n(.*?)(?=^## \[)", text, re.M | re.S)
          body = (m.group(1).strip() if m else f"QT Downloader {ver}")
          body += ("\n\n### Tải về\n- **`QTDownloader-%s-setup.exe`** — bộ cài (khuyên dùng): cài không cần quyền quản trị,"
                   " gỡ trong Cài đặt › Ứng dụng, tự cập nhật.\n- `QTDownloader-%s-win64.zip` — bản giải nén chạy ngay.\n"
                   "- `QTDownloader-extension-%s.zip` — extension Chrome/Edge/Cốc Cốc.\n"
                   "- `TDownload-%s-win64.zip` — bản sao cho trình cập nhật của TDownload ≤ 1.0.3.\n"
                   "- `SHA256SUMS.txt` — mã SHA-256 của các tệp trên.\n" % (ver, ver, ver, ver))
          if signed:
              body += ("\nBộ cài và `QTDownloader.exe` được ký số. Free code signing provided by "
                       "[SignPath.io](https://about.signpath.io/), certificate by "
                       "[SignPath Foundation](https://signpath.org/).\n")
          else:
              body += ("\n> **Bản này chưa ký số.** Windows 11 bật *Smart App Control* sẽ chặn hẳn bộ cài (không có nút chạy "
                       "tiếp) — tạm tắt Smart App Control hoặc chờ bản có chữ ký. Máy chỉ có SmartScreen: *More info → Run "
                       "anyway*.\n")
          open("release-notes.md", "w", encoding="utf-8").write(body)

      - name: Tạo GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Get-ChildItem release | Format-Table Name, Length
          gh release create $env:TAG (Get-ChildItem release).FullName --title "QT Downloader $env:VERSION" --notes-file release-notes.md --target $env:GITHUB_SHA

      - name: Lưu bản chạy thử (không xuất bản)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            release/
            release-notes.md
          retention-days: 7
